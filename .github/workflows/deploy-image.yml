name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: [8.1, 8.2, 8.3, 8.4]
        include:
          - php_version: 8.4
            tags: ["php8", "php8.4"]
          - php_version: 8.3
            tags: ["php8.3"]
          - php_version: 8.2
            tags: ["php8.2"]
          - php_version: 8.1
            tags: ["php8.1"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push PHP-FPM Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: PHP_VERSION=${{ matrix.php_version }}
          push: true
          tags: ${{ join(',', format('ghcr.io/auroradevllc/php-fpm-laravel:{0}', matrix.tags)) }}

  build-caddy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: [8.1, 8.2, 8.3, 8.4]
        include:
          - php_version: 8.4
            tags: ["php8-caddy", "php8.4-caddy"]
          - php_version: 8.3
            tags: ["php8.3-caddy"]
          - php_version: 8.2
            tags: ["php8.2-caddy"]
          - php_version: 8.1
            tags: ["php8.1-caddy"]
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Caddy Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.caddy
          build-args: PHP_VERSION=${{ matrix.php_version }}
          push: true
          tags: ${{ join(',', format('ghcr.io/auroradevllc/php-fpm-laravel:{0}', matrix.tags)) }}
